name: 更新还款日历

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: calendar-publish
  cancel-in-progress: true

on:
  push:
    paths: [助学贷款还款计划表.py, 助学贷款还款计划表.xlsx]
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: 安装依赖
        run: pip install openpyxl

      - name: 生成订阅源
        run: python 助学贷款还款计划表.py publish

      - name: 确认文件
        run: ls -la publish/

      - name: 提交并推送
        run: |
          git config user.name  "loan-calendar[bot]"
          git config user.email "loan-calendar@users.noreply.github.com"
          git add publish/loan.ics
          git commit -m "chore: 刷新还款日历 $(TZ=Asia/Shanghai date +%F)" || true
          git push || true

      - name: 上传到 GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 打印订阅地址
        run: |
          echo "订阅地址："
          echo "  https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/loan.ics"
          echo "  webcal://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/loan.ics"
