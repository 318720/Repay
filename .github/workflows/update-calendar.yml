name: 更新还款日历

permissions:
  contents: write

concurrency:
  group: calendar-publish
  cancel-in-progress: true

on:
  push:
    paths: [助学贷款还款计划表.py, 助学贷款还款计划表.xlsx]
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: 生成订阅源
        run: python 助学贷款还款计划表.py publish

      - name: 有变化才提交
        id: commit
        run: |
          if git diff --quiet publish/loan.ics; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ loan.ics 无变化，跳过提交"
          else
            git config user.name  "loan-calendar[bot]"
            git config user.email "loan-calendar@users.noreply.github.com"
            git add publish/loan.ics
            git commit -m "chore: 刷新还款日历 $(TZ=Asia/Shanghai date +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "✅ 已推送新版 loan.ics"
          fi

      - name: 兜底提示
        if: always()
        run: |
          echo "------------------------------------------------------------"
          echo "订阅地址（手机里只填这一次）："
          echo "  webcal://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/loan.ics"
          echo "------------------------------------------------------------"
